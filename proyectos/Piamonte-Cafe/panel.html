    <!-- ===== BARRA DE ARRIBA ===== -->
    <header class="panel-barra">
        <span class="tarjeta-marca"><span class="logo-nombre">Piamonte</span> <span class="logo-cafe">sellos</span></span>
        <button type="button" class="panel-salir" id="panel-salir" hidden>Salir</button>
    </header>

    <main class="panel-contenido">
        <p class="aviso-demo" id="aviso-demo" hidden>Modo demostración · PIN 123456</p>

        <!-- ===== PANTALLA 1: PIN ===== -->
        <div class="fidelidad-pantalla" id="pantalla-pin">
            <form class="formulario" id="form-pin" novalidate>
                <h1 class="panel-titulo">Panel de sellos</h1>
                <label for="pin">PIN del café</label>
                <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" required>
                <p class="formulario-error" id="pin-error" role="alert"></p>
                <button type="submit" class="boton">Entrar</button>
            </form>
        </div>

        <!-- ===== PANTALLA 2: BUSCAR Y SELLAR ===== -->
        <div class="fidelidad-pantalla" id="pantalla-panel" hidden>
            <form class="formulario panel-buscar" id="form-buscar" novalidate>
                <label for="buscar-celular">Celular del cliente</label>
                <div class="panel-buscar-fila">
                    <input id="buscar-celular" name="celular" type="tel" inputmode="numeric" autocomplete="off" placeholder="316 000 0000" maxlength="16" required>
                    <button type="submit" class="boton" aria-label="Buscar"><svg class="icono" aria-hidden="true"><use href="#i-buscar"/></svg><span class="panel-buscar-texto">Buscar</span></button>
                </div>
                <p class="formulario-error" id="buscar-error" role="alert"></p>
            </form>

            <!-- Cliente encontrado -->
            <div class="panel-cliente" id="panel-cliente" hidden>
                <p class="panel-nombre" id="cliente-nombre"></p>
                <p class="panel-celular" id="cliente-celular"></p>
                <ol class="sellos sellos-panel" id="cliente-sellos" aria-label="Sellos"></ol>
                <p class="panel-conteo" id="cliente-conteo" aria-live="polite"></p>
                <!-- Mensaje para que el barista se lo diga al cliente (el mismo que ve en su tarjeta) -->
                <p class="panel-mensaje" id="cliente-mensaje"></p>

                <!-- Aviso de sello reciente: pide confirmar -->
                <div class="panel-confirmar" id="confirmar-reciente" hidden>
                    <p id="confirmar-texto"></p>
                    <div class="panel-confirmar-botones">
                        <button type="button" class="boton" id="confirmar-si">Sí, es otra compra</button>
                        <button type="button" class="boton boton-borde" id="confirmar-no">Cancelar</button>
                    </div>
                </div>

                <button type="button" class="boton panel-sellar" id="sellar"><svg class="icono" aria-hidden="true"><use href="#i-sello"/></svg>+1 sello</button>
                <button type="button" class="boton panel-sellar panel-premio" id="canjear" hidden><svg class="icono" aria-hidden="true"><use href="#i-regalo"/></svg>Entregar premio</button>
                <button type="button" class="enlace-boton panel-quitar" id="quitar">Quitar un sello</button>
            </div>

            <!-- Cliente sin tarjeta: inscribirlo desde aquí -->
            <form class="formulario panel-nuevo" id="form-nuevo" hidden novalidate>
                <p class="panel-nuevo-titulo">Este celular no tiene tarjeta. ¿La sacamos?</p>
                <label for="nuevo-nombre">Nombre del cliente</label>
                <input id="nuevo-nombre" name="nombre" type="text" autocomplete="off" maxlength="60" required>
                <label class="casilla">
                    <input type="checkbox" id="nuevo-acepta" required>
                    <span>El cliente autorizó que guardemos su nombre y celular para la tarjeta de sellos.</span>
                </label>
                <p class="formulario-error" id="nuevo-error" role="alert"></p>
                <button type="submit" class="boton"><svg class="icono" aria-hidden="true"><use href="#i-tarjeta"/></svg>Crear tarjeta</button>
            </form>
        </div>
    </main>

    <!-- Mensaje corto de confirmación ("Sello puesto") -->
    <p class="panel-aviso" id="panel-aviso" role="status" aria-live="polite"></p>

    <script src="js/fidelidad-api.js"></script>
    <script src="js/panel.js"></script>
